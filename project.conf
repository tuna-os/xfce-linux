name: xfce-linux

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - gnome-build-meta.bst:freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  branch: main
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        systemd-arch: "x86-64"
    - arch == "aarch64":
        go-arch: "arm64"
        systemd-arch: "arm64"
    - arch == "ppc64le":
        gcc_arch: "powerpc64le"
        go-arch: "ppc64le"
        systemd-arch: "ppc64-le"

# The uri to download built artifacts from for this project
# artifacts:
#   - url: https://gbm.gnome.org:11003
#     connection-config:
#       keepalive-time: 60
#       retry-limit: 5
#       retry-delay: 500
#       request-timeout: 180

# The home "Bihar" BuildGrid (grpc://100.104.213.39:30051, reached over
# Tailscale) used to be the first artifact + source cache here. That cluster is
# powered down and in storage, so every bst invocation spent time failing to
# reach it ("Failed to initialize remote ... UNAVAILABLE") and nothing could be
# pushed to it. CI does not need it: the multi-runner workflow carries the CAS
# between jobs as GHCR tarballs. Remotes are not part of any cache key, so
# removing or restoring them never triggers a rebuild.
#
# To restore once Bihar is back, re-add these entries (first in each list):
#
#   artifacts:
#     - url: grpc://100.104.213.39:30051
#       type: index
#       push: true
#
#   source-caches:
#     - url: grpc://100.104.213.39:30051
#       type: index
#       push: true
#
# For a one-off local build against it, prefer the opt-in user config instead:
#   BST_FLAGS="--config /src/scripts/buildgrid-remote.conf" just bst build ...
artifacts:
  - url: https://cache.freedesktop-sdk.io:11001
    push: false

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
      - flatpak_image
      - flatpak_repo
      - ostree
      - pyproject
    sources:
      - gen_cargo_lock
      - cargo2
      - git_module
      - git_repo
      - go_module
      - patch_queue
      - zip

  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
# Build ready
