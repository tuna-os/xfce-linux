[Config]
MinimumVersion=28~devel

[Distribution]
Distribution=buildstream
Release=snapshot
Architecture=x86-64

[Build]
ToolsTree=default

[Content]
Packages=mkosi/xfce-linux-ddi.bst
ExtraTrees=../../files/etc/os-release:/usr/lib/os-release

[Output]
Format=disk
Output=xfce-linux-ddi
Bootable=yes
Bootloader=systemd-boot

RepartDirectories=mkosi.repart
