# BuildStream config used by CI (mounted at /src inside the bst2 container).
# Single-runner jobs override scheduler counts via BST_FLAGS when needed.
scheduler:
  on-error: continue
  fetchers: 12
  builders: 1
  network-retries: 3
logging:
  message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
  error-lines: 80
build:
  max-jobs: 0
  retry-failed: True
cache:
  cache-buildtrees: never
  # Chunk jobs restore their own previous CAS and re-tar the whole directory,
  # so with no quota every stale artifact generation rides along forever: the
  # ten chunk tarballs measured 20-29 GB each on 2026-09-10 (~266 GB with
  # core) against a runner disk of ~100-110 GB, which is what killed
  # build_final in runs 34072176433, 34176106533 and 34298830711 (#159).
  # BuildStream only expires artifacts the current session does not require,
  # so this bounds the carried-over history, not the build.
  quota: 60G
