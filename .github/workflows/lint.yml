name: Lint

# Runs shellcheck and yamllint on PRs and pushes to main.
# Minimum guardrail to catch script errors before they break builds.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          additional_files: >
            build-xfwl4.sh
            xfce-linux/src/build-iso.sh
            xfce-linux/src/configure-live.sh
            xfce-linux/src/install-flatpaks.sh
            xfce-linux/src/dracut/95xfce-linux-isofile/module-setup.sh
            xfce-linux/src/dracut/95xfce-linux-isofile/xfce-linux-isofile.sh
          severity: error

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              comments-indentation: disable

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint on workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  renovate-config:
    name: Renovate Config Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate renovate.json
        run: npx --yes --package renovate -- renovate-config-validator renovate.json

  lint-bst:
    name: lint .bst files
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout bst-ci scripts
        uses: actions/checkout@v7
        with:
          repository: tuna-os/bst-ci
          ref: main
          path: .bst-ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Lint changed .bst files
        run: |
          pip install pyyaml
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=AM "origin/${{ github.event.pull_request.base.ref }}"...HEAD -- '*.bst')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .bst files changed in this PR."
            exit 0
          fi
          echo "Changed .bst files:"
          printf '  %s\n' "${files[@]}"
          python3 .bst-ci/scripts/lint_bst.py elements --check-new "${files[@]}"
